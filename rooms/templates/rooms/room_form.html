<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% if object %}Изменить комнату{% else %}Создать комнату{% endif %}</title>
    <style>body { font-family: sans-serif; margin: 20px; } form div { margin-bottom: 10px; }</style>
</head>
<body>
    <h1>{% if object %}Изменить комнату{% else %}Создать комнату{% endif %}</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Сохранить</button>
    </form>
    <a href="{% url 'room-list' %}">Назад к списку</a>
</body>
</html>
